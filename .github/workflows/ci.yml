name: AarogyaQ CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend - install & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend package with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest (quiet)
        run: pytest -q

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend – install & smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frontend dependencies
        run: pip install -r requirements_frontend.txt

      - name: Smoke test – import streamlit
        run: python -c "import streamlit"
